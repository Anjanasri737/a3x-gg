name: Flow OS Verify

on:
  push:
    branches:
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The repository's package.json and package-lock.json already drift on
      # @lovable.dev/vite-tanstack-config. Resolve the existing lock drift in
      # the ephemeral runner, then enforce architecture + strict TS + bundling.
      - run: npm install --no-audit --no-fund
      - name: Verify Flow OS architecture invariants
        run: node scripts/verify-flow-os.mjs
      - name: Strict TypeScript check
        run: npx tsc --noEmit --pretty false
      - run: npm run build
