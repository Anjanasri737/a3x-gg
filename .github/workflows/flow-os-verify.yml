name: Flow OS Verify

on:
  push:
    branches:
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The repository's package.json and package-lock.json already drift on
      # @lovable.dev/vite-tanstack-config (2.13.1 vs 2.7.1). `npm ci` fails
      # before TypeScript can be checked, so install resolves that existing
      # lock drift in the ephemeral runner and then performs the real build.
      - run: npm install --no-audit --no-fund
      - run: npm run build
